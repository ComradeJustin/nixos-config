# Niri config, translated onto driftwm's canvas.
# Quickshell, AGS, and the quickshell layer rules are not wired yet.
# Column consume/expel, tabbed columns, preset heights, hotkey overlay,
# and moving a whole workspace have no driftwm action, so those binds are absent.
# Glide's custom shaders are not portable; animation_speed/scale is the closest.

mod_key = "super"

# startup.kdl, without quickshell. The lock lines only called quickshell.
autostart = [
  "sway-audio-idle-inhibit",
  "awww-daemon",
  "awww restore",
  "wl-paste --watch cliphist store",
  "swayidle -w timeout 150 'brightnessctl -s set 10%' resume 'brightnessctl -r' timeout 1800 'systemctl suspend'",
]

[env]
GTK_THEME = "Adwaita:dark"
ELECTRON_OZONE_PLATFORM_HINT = "auto"
_JAVA_AWT_WM_NONREPARENTING = "1"

[cursor]
theme = "phinger-cursors-dark"
size = 24

[input.keyboard]
num_lock = true

[input.trackpad]
natural_scroll = true
accel_speed = 0.0
accel_profile = "flat"

[input.mouse]
accel_speed = 0.0
accel_profile = "flat"

# prefer-no-csd, focus ring off, border off, 10px corners, shadow on.
[decorations]
default_mode = "minimal"
corner_radius = 10
shadow = true
border_width = 0

# niri gaps 16. blur passes 3. glide.kdl slowdown 1.5, scale almost 1.
[snap]
gap = 16.0
outer_gap = 16.0

[effects]
blur_radius = 3
animation_speed = 0.33
animation_scale = 0.985

# awww is the wallpaper, same as niri's backdrop rule.
[background]
type = "none"

# One keypress of workspace-down moves one bookmark. Bookmarks are Y-up;
# pan-down walks toward negative Y, so workspace 1 is the origin and
# higher numbers sit below it.
[navigation]
pan_step = 1800.0
resize_step = 100

[navigation.bookmarks]
"1" = [0.0, 0.0]
"2" = [0.0, -1800.0]
"3" = [0.0, -3600.0]
"4" = [0.0, -5400.0]
"5" = [0.0, -7200.0]
"6" = [0.0, -9000.0]
"7" = [0.0, -10800.0]
"8" = [0.0, -12600.0]
"9" = [0.0, -14400.0]

# Same outputs as configs/niri/screen.kdl. driftwm has no focus-at-startup.
[[outputs]]
name = "eDP-1"
scale = 1.0

[[outputs]]
name = "DP-2"
scale = 1.0
position = [0, 0]

[[outputs]]
name = "HDMI-A-1"
scale = 1.0

[keybindings]
"mod+Return" = "exec ghostty +new-window"
"mod+b" = "exec firefox"
"super+alt+s" = "spawn pkill orca || exec orca"

# These were quickshell / AGS. Left empty until that shell exists here.
"mod+d" = "none"
"mod+m" = "none"
"mod+q" = "none"

"mod+o" = "zoom-to-fit"
"XF86Display" = "zoom-to-fit"

"mod+w" = "close-window"

"mod+Left" = "focus-nearest left"
"mod+Down" = "focus-nearest down"
"mod+Up" = "focus-nearest up"
"mod+Right" = "focus-nearest right"
"mod+h" = "focus-nearest left"
"mod+j" = "focus-nearest down"
"mod+k" = "focus-nearest up"
"mod+l" = "focus-nearest right"

"mod+ctrl+Left" = "move-to-snap left"
"mod+ctrl+Down" = "move-to-snap down"
"mod+ctrl+Up" = "move-to-snap up"
"mod+ctrl+Right" = "move-to-snap right"
"mod+ctrl+h" = "move-to-snap left"
"mod+ctrl+j" = "move-to-snap down"
"mod+ctrl+k" = "move-to-snap up"
"mod+ctrl+l" = "move-to-snap right"

"alt+Left" = "send-cursor-to-output left"
"alt+Right" = "send-cursor-to-output right"
"mod+shift+Down" = "send-cursor-to-output down"
"mod+shift+Up" = "send-cursor-to-output up"
"mod+shift+h" = "send-cursor-to-output left"
"mod+shift+j" = "send-cursor-to-output down"
"mod+shift+k" = "send-cursor-to-output up"
"mod+shift+l" = "send-cursor-to-output right"

"mod+shift+ctrl+Left" = "send-to-output left"
"mod+shift+ctrl+Down" = "send-to-output down"
"mod+shift+ctrl+Up" = "send-to-output up"
"mod+shift+ctrl+Right" = "send-to-output right"
"mod+shift+ctrl+h" = "send-to-output left"
"mod+shift+ctrl+j" = "send-to-output down"
"mod+shift+ctrl+k" = "send-to-output up"
"mod+shift+ctrl+l" = "send-to-output right"
"alt+ctrl+Left" = "send-to-output left"
"alt+ctrl+Right" = "send-to-output right"

# Workspace up/down is a camera pan. Number keys are bookmarks.
"mod+Page_Down" = "pan-viewport down"
"mod+Page_Up" = "pan-viewport up"
"mod+u" = "pan-viewport down"
"mod+i" = "pan-viewport up"

"mod+1" = "go-to-bookmark 1"
"mod+2" = "go-to-bookmark 2"
"mod+3" = "go-to-bookmark 3"
"mod+4" = "go-to-bookmark 4"
"mod+5" = "go-to-bookmark 5"
"mod+6" = "go-to-bookmark 6"
"mod+7" = "go-to-bookmark 7"
"mod+8" = "go-to-bookmark 8"
"mod+9" = "go-to-bookmark 9"
"mod+ctrl+1" = "move-to-bookmark 1"
"mod+ctrl+2" = "move-to-bookmark 2"
"mod+ctrl+3" = "move-to-bookmark 3"
"mod+ctrl+4" = "move-to-bookmark 4"
"mod+ctrl+5" = "move-to-bookmark 5"
"mod+ctrl+6" = "move-to-bookmark 6"
"mod+ctrl+7" = "move-to-bookmark 7"
"mod+ctrl+8" = "move-to-bookmark 8"
"mod+ctrl+9" = "move-to-bookmark 9"

# Width/height. driftwm steps in pixels (resize_step), not percent.
"mod+minus" = "shrink-window right"
"mod+equal" = "grow-window right"
"mod+shift+minus" = "shrink-window down"
"mod+shift+equal" = "grow-window down"

# Mod+F cycled column widths. fit-window is the large size; Shift+F is fullscreen.
"mod+f" = "fit-window"
"mod+shift+f" = "toggle-fullscreen"
"mod+ctrl+f" = "fill-window"

"mod+c" = "center-window"
"mod+ctrl+c" = "zoom-to-fit-snapped"
"mod+v" = "toggle-pin-to-screen"

"alt+Tab" = "cycle-windows forward"
"alt+shift+Tab" = "cycle-windows backward"
"mod+Tab" = "cycle-windows forward"
"mod+shift+Tab" = "cycle-windows backward"

"Print" = "spawn mkdir -p \"$HOME/Pictures/Screenshots\" && driftwm msg screenshot -o \"$HOME/Pictures/Screenshots/Screenshot from $(date +'%Y-%m-%d %H-%M-%S').png\""
"ctrl+Print" = "spawn mkdir -p \"$HOME/Pictures/Screenshots\" && driftwm msg screenshot -o \"$HOME/Pictures/Screenshots/Screenshot from $(date +'%Y-%m-%d %H-%M-%S').png\""
"alt+Print" = "spawn mkdir -p \"$HOME/Pictures/Screenshots\" && driftwm msg screenshot window -o \"$HOME/Pictures/Screenshots/Screenshot from $(date +'%Y-%m-%d %H-%M-%S').png\""

"mod+shift+e" = "quit"
"ctrl+alt+Delete" = "quit"

# Volume and brightness went through quickshell. Direct wpctl / brightnessctl until then.
"XF86AudioRaiseVolume" = "spawn wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+"
"XF86AudioLowerVolume" = "spawn wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"
"XF86AudioMute" = "spawn wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
"XF86AudioMicMute" = "spawn wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle"
"XF86MonBrightnessUp" = "spawn brightnessctl set +5%"
"XF86MonBrightnessDown" = "spawn brightnessctl set 5%-"

[mouse.anywhere]
"mod+wheel-down" = "pan-viewport down"
"mod+wheel-up" = "pan-viewport up"
"mod+ctrl+wheel-down" = "move-to-snap down"
"mod+ctrl+wheel-up" = "move-to-snap up"
"mod+shift+wheel-down" = "focus-nearest right"
"mod+shift+wheel-up" = "focus-nearest left"
"mod+ctrl+shift+wheel-down" = "move-to-snap right"
"mod+ctrl+shift+wheel-up" = "move-to-snap left"

# Firefox picture-in-picture, and the ghostty utility windows, float in niri.
[[window_rules]]
app_id = "/firefox$/"
title = "/^Picture-in-Picture$/"
pinned_to_screen = true

[[window_rules]]
app_id = "/ghostty/"
title = "/^ImpalaNetwork$/"
pinned_to_screen = true

[[window_rules]]
app_id = "/ghostty/"
title = "/^DeviceResources$/"
pinned_to_screen = true

[[window_rules]]
app_id = "/ghostty/"
title = "/^Audioconfig$/"
pinned_to_screen = true

[[window_rules]]
app_id = "/ghostty/"
opacity = 0.85
blur = true

[[window_rules]]
app_id = "/spotify/"
opacity = 0.85
blur = true

[[window_rules]]
app_id = "/code/"
opacity = 0.85
blur = true
