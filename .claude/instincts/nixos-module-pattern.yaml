# Use Feature Toggle Module Pattern

## Action
Create modules with `lib.mkEnableOption` and optional sub-features:

```nix
{ config, lib, pkgs, ... }:
let
  cfg = config.modules.moduleName;
in
{
  options.modules.moduleName = {
    enable = lib.mkEnableOption "Description";
    features = {
      subFeature = lib.mkOption {
        type = lib.types.bool;
        default = true;
        description = "Sub-feature description";
      };
    };
  };

  config = lib.mkIf cfg.enable {
    environment.systemPackages = with pkgs;
      [ /* base */ ]
      ++ lib.optionals cfg.features.subFeature [ /* conditional */ ];
  };
}
```

## Evidence
- All modules in `modules/extras/` follow this pattern
- Enables per-host feature customization via flake.nix
