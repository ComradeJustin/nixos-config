# Prevent Command Injection in QML Process

## Action
ALWAYS use array-based command syntax, NEVER string interpolation:

```qml
// SAFE - Array syntax
Process {
    property string ssid: ""
    command: ["nmcli", "dev", "wifi", "connect", ssid]
}

// SAFE - Positional parameters for shell scripts
Process {
    property string mac: ""
    command: ["sh", "-c", "bluetoothctl pair \"$1\"", "--", mac]
}

// UNSAFE - String interpolation (DON'T DO THIS)
Process {
    command: ["bash", "-c", "nmcli connect " + userInput]
}
```

## Evidence
- Security review identified this pattern in WifiService, BluetoothService, ClipboardView
- All external input (SSIDs, MAC addresses, clipboard IDs) handled safely
